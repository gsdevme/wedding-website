# Serves the static site. Replaces the image's default.conf.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  # Kept for the existing Kubernetes liveness/readiness probes.
  location = /api/healthz {
    default_type application/json;
    add_header Cache-Control "public, s-maxage=10, must-revalidate";
    return 200 '{"success":"ok"}';
  }

  # Assets have no cache-busting; a content change means a new path.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, s-maxage=600";
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  access_log /dev/stdout;
  error_log /dev/stderr warn;
}
